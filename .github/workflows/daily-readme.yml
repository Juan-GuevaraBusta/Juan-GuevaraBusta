name: Daily README Update

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rotate Daily Dose section
        run: python update_readme.py

      - name: Commit and push
        run: |
          git config user.name "Juan Guevara Bustamante"
          git config user.email "jguevarabustamante25@gmail.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "chore: rotate daily dose of code"
          git push
